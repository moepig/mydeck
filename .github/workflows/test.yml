name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ----------------------------------------------------------
  # 0. 変更パス検出
  # ----------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      board: ${{ steps.filter.outputs.board }}
      win_src: ${{ steps.filter.outputs.win_src }}
      win_tests: ${{ steps.filter.outputs.win_tests }}
      win_installer: ${{ steps.filter.outputs.win_installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            board:
              - 'board/**'
              - '.github/workflows/**'
            win_src:
              - 'win/MyDeck/**'
              - '.github/workflows/**'
            win_tests:
              - 'win/MyDeck.Tests/**'
              - '.github/workflows/**'
            win_installer:
              - 'win/MyDeck.Installer/**'
              - 'win/MyDeck.Installer.Tests/**'
              - '.github/workflows/**'

  # ----------------------------------------------------------
  # 1. Pro Micro ユニットテスト（PlatformIO native）
  # ----------------------------------------------------------
  promicro:
    name: Pro Micro (PlatformIO native)
    needs: changes
    if: needs.changes.outputs.board == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: board

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('board/platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Run tests (native)
        run: pio test -e native -v

  # ----------------------------------------------------------
  # 2. Windows C# ユニットテスト（NUnit）
  # ----------------------------------------------------------
  win:
    name: Windows C# (NUnit)
    needs: changes
    if: needs.changes.outputs.win_src == 'true' || needs.changes.outputs.win_tests == 'true'
    runs-on: windows-latest

    defaults:
      run:
        working-directory: win

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: |
          dotnet restore MyDeck/MyDeck.csproj
          dotnet restore MyDeck.Tests/MyDeck.Tests.csproj

      - name: Build
        run: dotnet build MyDeck.Tests/MyDeck.Tests.csproj --no-restore --configuration Release

      - name: Run tests
        run: dotnet test MyDeck.Tests/MyDeck.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  # ----------------------------------------------------------
  # 3. インストーラー ビルド + 静的テスト + 動的テスト
  #    windows-latest ランナー上で直接実行（管理者権限あり）
  # ----------------------------------------------------------
  installer:
    name: Installer (WiX + Pester)
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.win_src == 'true' || needs.changes.outputs.win_installer == 'true'

    defaults:
      run:
        working-directory: win
        shell: pwsh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Install WiX toolset
        run: dotnet tool install --global wix --version "5.0.2"

      - name: Add WiX extensions
        run: |
          wix extension add WixToolset.UI.wixext/5.0.2
          wix extension add WixToolset.Util.wixext/5.0.2

      - name: Publish app (win-x64 self-contained)
        run: |
          dotnet publish MyDeck/MyDeck.csproj `
            -c Release -r win-x64 --self-contained `
            -o artifacts/publish

      - name: Build installer
        run: |
          dotnet build MyDeck.Installer/MyDeck.Installer.wixproj `
            -c Release `
            -p:PublishDir=${{ github.workspace }}\win\artifacts\publish\
          New-Item -ItemType Directory -Force -Path artifacts/installer
          Copy-Item MyDeck.Installer/bin/x64/Release/en-US/MyDeck-Setup.msi artifacts/installer/

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MyDeck-Setup
          path: win/artifacts/installer/MyDeck-Setup.msi
          retention-days: 30

      - name: Install Pester
        run: Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.0.0

      - name: Run static installer tests
        run: |
          $result = Invoke-Pester MyDeck.Installer.Tests/Install.Tests.ps1 `
            -Tag Static -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Run dynamic installer tests
        env:
          MSI_PATH: ${{ github.workspace }}\win\artifacts\installer\MyDeck-Setup.msi
        run: |
          $result = Invoke-Pester MyDeck.Installer.Tests/Install.Tests.ps1 `
            -Tag Dynamic -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
